<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEMISTRY CHALLENGE – ESTER & LIPID</title>
<style>
:root{--teal:#25b9ad;--orange:#ff9b54;--purple:#9171d5;--cream:#f8f5ec;--ink:#243044}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e5faf6,#fff1df 55%,#f0eaff);font-family:Arial,sans-serif;color:var(--ink);padding:22px}
main{max-width:820px;margin:auto}.hero,.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #24304415;margin-bottom:18px}
.hero{text-align:center;border-top:9px solid var(--teal)}.tag{color:#168c83;font-weight:700;letter-spacing:2px;font-size:12px}
h1{font-size:clamp(26px,5vw,42px);margin:10px 0;color:#263b58}h2{font-size:20px;margin-top:0}
.sub{color:#657184;line-height:1.5}.progress{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--teal);width:0;transition:.2s}
.q{border:1px solid #e7eaf0;border-radius:16px;padding:18px;margin:16px 0}.q h3{font-size:17px;margin:0 0 12px}
.option{display:block;padding:12px 14px;margin:8px 0;border:1px solid #dfe5ec;border-radius:12px;cursor:pointer;line-height:1.4}
.option:hover{border-color:var(--teal);background:#f1fbf9}.option input{margin-right:9px;accent-color:var(--teal)}
button{border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;font-size:15px}
.primary{background:var(--teal);color:white}.secondary{background:#eee9fb;color:#5b43a0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{padding:12px;border-radius:12px;margin-top:10px;font-size:14px;line-height:1.5}.correct{background:#e8f8ef;color:#17663a}.wrong{background:#fff0e9;color:#9a481d}
#result{display:none;text-align:center}.score{font-size:42px;font-weight:800;color:#168c83}.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="tag">HÓA HỌC 12 · KẾT NỐI TRI THỨC</div>
<h1>🧪 CHEMISTRY CHALLENGE<br>ESTER &amp; LIPID</h1>
<p class="sub">10 câu hỏi trắc nghiệm · Chọn đáp án đúng và kiểm tra kiến thức của bạn!</p>
</section>
<section class="panel" id="quiz">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>Thử thách kiến thức</strong><span class="small" id="counter">Đã trả lời 0/10</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="questions"></div>
<div class="actions">
<button class="primary" id="submit">Nộp bài &amp; xem kết quả</button>
<button class="secondary" id="reset">Làm lại</button>
</div>
<p class="small">Bài làm dựa trên tài liệu “Bài tập trắc nghiệm: Ester – Lipid” do bạn cung cấp.</p>
</section>
<section class="panel" id="result">
<div class="tag">KẾT QUẢ CỦA BẠN</div><h2>Hoàn thành thử thách!</h2>
<div class="score" id="score"></div><p id="message"></p>
<div class="actions" style="justify-content:center"><button class="primary" onclick="window.print()">In / lưu kết quả</button><button class="secondary" id="again">Làm lại từ đầu</button></div>
</section>
</main>
<script>
const data=[
["Công thức tổng quát của ester no, đơn chức, mạch hở là:",["CₙH₂ₙO₂ (n ≥ 2)","CₙH₂ₙ₋₂O₂ (n ≥ 3)","CₙH₂ₙO (n ≥ 1)","CₙH₂ₙ₋₂O₄ (n ≥ 4)"],0,"Ester no, đơn chức, mạch hở có công thức chung CₙH₂ₙO₂ (n ≥ 2)."],
["Chất nào sau đây thuộc loại ester?",["CH₃COOH","C₂H₅OH","CH₃COOC₂H₅","CH₃CHO"],2,"CH₃COOC₂H₅ có nhóm chức ester –COO–."],
["Thủy phân ethyl acetate trong dung dịch NaOH đun nóng thu được:",["Acetic acid và ethanol","Sodium acetate và ethanol","Sodium acetate và sodium ethoxide","Acetic acid và sodium ethoxide"],1,"Phương trình: CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH."],
["Ester CH₃COOCH₃ có tên gọi là gì?",["Methyl acetate","Ethyl acetate","Methyl formate","Ethyl formate"],0,"Gốc acid CH₃COO– là acetate; gốc alcohol –CH₃ là methyl."],
["Chất béo là ester của glycerol với các:",["Alcohol đa chức","Acid béo (monocarboxylic acid mạch carbon dài, không phân nhánh)","Dicarboxylic acid","Aromatic acid"],1,"Chất béo là triester của glycerol với các acid béo."],
["Phát biểu nào đúng về tính chất vật lý của ester?",["Ester thường ít tan hoặc không tan trong nước do không tạo được liên kết hydrogen với nước","Ester có nhiệt độ sôi cao hơn nhiều alcohol và acid cùng khối lượng mol","Ester luôn nặng hơn nước và không bay hơi","Đa số ester có mùi khó chịu"],0,"Theo tài liệu, ester thường ít tan hoặc không tan trong nước và có nhiệt độ sôi thấp hơn alcohol/acid tương ứng."],
["Acetic acid phản ứng với ethanol có H₂SO₄ đặc, đun nóng là phản ứng gì?",["Xà phòng hóa","Ester hóa","Trùng hợp","Thủy phân"],1,"Acid carboxylic phản ứng với alcohol tạo ester và nước là phản ứng ester hóa."],
["Chất béo nào sau đây thường ở trạng thái lỏng ở điều kiện thường?",["Tristearin","Triolein","Tripalmitin","Mỡ động vật"],1,"Triolein có gốc hydrocarbon không no nên thường ở trạng thái lỏng."],
["Để biến đổi dầu thực vật thành chất béo rắn, người ta thực hiện phản ứng nào?",["Thủy phân trong môi trường acid","Xà phòng hóa","Hydrogen hóa (cộng H₂)","Dehydrogen hóa"],2,"Cộng hydrogen vào gốc không no giúp chuyển chất béo lỏng thành chất béo rắn hơn."],
["Xà phòng là hỗn hợp muối sodium hoặc potassium của:",["Các acid béo","Các alcohol bậc cao","Các amino acid","Các dicarboxylic acid"],0,"Xà phòng là muối sodium hoặc potassium của các acid béo."]
];
const host=document.getElementById('questions');
data.forEach((q,i)=>{let el=document.createElement('div');el.className='q';el.innerHTML=`<h3>Câu ${i+1}. ${q[0]}</h3>`+q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><b>${"ABCD"[j]}.</b> ${a}</label>`).join('')+`<div id="fb${i}"></div>`;host.appendChild(el)});
function update(){let n=data.filter((q,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;document.getElementById('counter').textContent=`Đã trả lời ${n}/10`;document.getElementById('bar').style.width=(n*10)+'%'}
document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))update()});
document.getElementById('submit').onclick=()=>{let unanswered=data.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;if(unanswered){alert(`Bạn còn ${unanswered} câu chưa trả lời.`);return}let score=0;data.forEach((q,i)=>{let v=Number(document.querySelector(`input[name=q${i}]:checked`).value);let ok=v===q[2];if(ok)score++;document.getElementById('fb'+i).className='feedback '+(ok?'correct':'wrong');document.getElementById('fb'+i).innerHTML=(ok?'✓ Chính xác!':'✗ Chưa chính xác. Đáp án đúng: '+ "ABCD"[q[2]]+'.')+'<br>'+q[3]});document.getElementById('score').textContent=score+'/10 điểm';document.getElementById('message').textContent=score===10?'Xuất sắc! Bạn đã nắm rất chắc nội dung.':score>=7?'Rất tốt! Hãy xem lại những câu bạn chưa đúng.':'Hãy ôn lại kiến thức và thử sức thêm lần nữa nhé!';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});document.getElementById('submit').disabled=true};
function reset(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);data.forEach((q,i)=>{let f=document.getElementById('fb'+i);f.className='';f.innerHTML=''});document.getElementById('submit').disabled=false;document.getElementById('result').style.display='none';update();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
</script>
</body>
</html>
